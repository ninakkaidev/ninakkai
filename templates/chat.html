<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninakkai Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --primary-color: #E91E63; /* Pink for romantic theme */
            --secondary-color: #2196F3; /* Blue */
            --bg-color: #f8f9fa;
            --text-color: #333;
            --bubble-sent: #dcf8c6;
            --bubble-received: #ffffff;
            --unread-dot: #2196F3; /* Blue dot for unread */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #chat-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #conversation-list {
            width: 350px;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 10px;
            background-color: white;
        }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        #chat-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        #message-input {
            padding: 15px;
            border-top: 1px solid #ddd;
            background-color: white;
            display: flex;
        }

        #message-input input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 15px;
            margin-right: 10px;
        }

        #message-input button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            position: relative;
        }

        .conversation-item.active {
            background-color: #f0f0f0;
        }

        .conversation-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .conversation-info {
            flex: 1;
        }

        .conversation-name {
            font-weight: bold;
        }

        .conversation-last-msg {
            color: gray;
            font-size: 0.9em;
        }

        .unread-badge {
            background-color: var(--unread-dot);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.8em;
            position: absolute;
            right: 10px;
            top: 20px;
        }

        .message {
            max-width: 60%;
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 20px;
            position: relative;
        }

        .message.sent {
            background-color: var(--bubble-sent);
            align-self: flex-end;
        }

        .message.received {
            background-color: var(--bubble-received);
            align-self: flex-start;
            border: 1px solid #ddd;
        }

        .message-time {
            font-size: 0.7em;
            color: gray;
            position: absolute;
            bottom: -15px;
            right: 10px;
        }

        .typing-indicator {
            font-size: 0.8em;
            color: gray;
            align-self: flex-start;
            padding: 10px;
        }

        #back-to-explore {
            display: none;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            #chat-container {
                flex-direction: column;
            }

            #conversation-list {
                width: 100%;
                height: 100%;
                border-right: none;
            }

            #chat-area {
                display: none;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            #chat-area.active {
                display: flex;
            }

            #conversation-list.active {
                display: none;
            }

            #back-to-explore {
                display: block;
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
            }

            #chat-header {
                justify-content: flex-start;
            }

            #chat-header .back-btn {
                margin-right: 15px;
            }
        }

        /* Attractive UI enhancements */
        .conversation-item:hover {
            background-color: #f8f9fa;
            transition: background-color 0.3s;
        }

        .message {
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        #message-input button:hover {
            background-color: darken(var(--primary-color), 10%);
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="conversation-list" class="active">
            <h4 class="p-3 border-bottom">Chats <span class="badge bg-primary" id="total-unread">{{ unread_count if unread_count > 0 }}</span></h4>
            {% for conv in conversations %}
            <div class="conversation-item" data-user-id="{{ conv.id }}" onclick="openChat('{{ conv.id }}', '{{ conv.full_name }}', '{{ conv.image }}')">
                <img src="{{ conv.image }}" alt="{{ conv.full_name }}">
                <div class="conversation-info">
                    <div class="conversation-name">{{ conv.full_name }}</div>
                    <div class="conversation-last-msg">{{ conv.last_message | truncate(30) }}</div>
                </div>
                {% if conv.unread > 0 %}
                <span class="unread-badge">{{ conv.unread }}</span>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <div id="chat-area">
            <div id="chat-header">
                <button class="btn btn-link back-btn d-md-none" onclick="backToList()"><i class="fas fa-arrow-left"></i></button>
                <div id="chat-user-info" class="d-flex align-items-center">
                    <img id="chat-user-img" src="" alt="" class="me-2 rounded-circle" style="width:40px;height:40px;">
                    <span id="chat-user-name"></span>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-danger" onclick="blockUser()">Block</button>
                </div>
            </div>
            <div id="chat-messages"></div>
            <div id="message-input">
                <input type="text" id="message-text" placeholder="Type a message..." onkeydown="handleTyping(event)">
                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <a href="/explore" class="btn btn-primary d-md-none" id="back-to-explore">Back to Explore</a>

    <script>
        const currentUserId = '{{ current_user_id }}';
        const socket = io({
            auth: { user_id: currentUserId }
        });

        let selectedUserId = null;
        let typingTimeout = null;
        let isTyping = false;

        socket.on('connect', () => {
            console.log('Connected to SocketIO');
        });

        socket.on('new_message', (msg) => {
            if ((msg.sender_id === selectedUserId && msg.receiver_id === currentUserId) || 
                (msg.sender_id === currentUserId && msg.receiver_id === selectedUserId)) {
                appendMessage(msg);
                scrollToBottom();
            }
        });

        socket.on('user_typing', (data) => {
            if (data.sender_id === selectedUserId) {
                showTypingIndicator();
            }
        });

        socket.on('update_conversation', (data) => {
            updateConversationList(data);
        });

        socket.on('messages_read', (data) => {
            if (data.conversation_id === selectedUserId) {
                // Update UI to mark messages as read if needed
            }
        });

        socket.on('message_deleted', (data) => {
            const msgElement = document.querySelector(`[data-msg-id="${data.message_id}"]`);
            if (msgElement) {
                msgElement.remove();
            }
        });

        function openChat(userId, fullName, image) {
            selectedUserId = userId;
            document.getElementById('chat-user-name').textContent = fullName;
            document.getElementById('chat-user-img').src = image;
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('chat-area').classList.add('active');
            document.getElementById('conversation-list').classList.remove('active');
            fetchMessages(userId);
            markAsReadInList(userId);
        }

        function backToList() {
            document.getElementById('chat-area').classList.remove('active');
            document.getElementById('conversation-list').classList.add('active');
            selectedUserId = null;
        }

        function fetchMessages(userId) {
            fetch(`/messages/${userId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        data.messages.forEach(msg => appendMessage(msg));
                        scrollToBottom();
                    }
                });
        }

        function appendMessage(msg) {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', msg.sender_id === currentUserId ? 'sent' : 'received');
            msgDiv.dataset.msgId = msg.id;
            msgDiv.innerHTML = `
                <div>${msg.message}</div>
                <small class="message-time">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</small>
            `;
            if (msg.replied_to) {
                const repliedDiv = document.createElement('div');
                repliedDiv.classList.add('replied-msg');
                repliedDiv.textContent = msg.replied_text;
                msgDiv.insertBefore(repliedDiv, msgDiv.firstChild);
            }
            if (msg.sender_id === currentUserId) {
                const deleteBtn = document.createElement('button');
                deleteBtn.classList.add('btn', 'btn-sm', 'btn-link');
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                deleteBtn.onclick = () => deleteMessage(msg.id);
                msgDiv.appendChild(deleteBtn);
            }
            messagesDiv.appendChild(msgDiv);
        }

        function sendMessage() {
            const input = document.getElementById('message-text');
            const message = input.value.trim();
            if (message && selectedUserId) {
                fetch('/send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to_user_id: selectedUserId, message })
                }).then(res => res.json())
                .then(data => {
                    if (data.success) {
                        input.value = '';
                    }
                });
            }
        }

        function handleTyping(event) {
            if (!isTyping) {
                socket.emit('typing', { sender_id: currentUserId, to_user_id: selectedUserId });
                isTyping = true;
            }
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
            }, 2000);

            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function showTypingIndicator() {
            const messagesDiv = document.getElementById('chat-messages');
            let typing = document.querySelector('.typing-indicator');
            if (!typing) {
                typing = document.createElement('div');
                typing.classList.add('typing-indicator');
                typing.textContent = 'Typing...';
                messagesDiv.appendChild(typing);
                scrollToBottom();
            }
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                if (typing) typing.remove();
            }, 2000);
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('chat-messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateConversationList(data) {
            // Find and update the conversation item in the list
            const convItems = document.querySelectorAll('.conversation-item');
            convItems.forEach(item => {
                if (item.dataset.userId === data.conversation_id) {
                    const lastMsg = item.querySelector('.conversation-last-msg');
                    lastMsg.textContent = data.last_message;
                    // Move to top if needed
                    item.parentNode.prepend(item);
                }
            });
        }

        function markAsReadInList(userId) {
            const convItem = document.querySelector(`.conversation-item[data-user-id="${userId}"]`);
            if (convItem) {
                const badge = convItem.querySelector('.unread-badge');
                if (badge) badge.remove();
            }
            // Update total unread
            const totalUnread = document.getElementById('total-unread');
            let count = parseInt(totalUnread.textContent || 0) - 1;
            totalUnread.textContent = count > 0 ? count : '';
        }

        function deleteMessage(msgId) {
            fetch('/delete_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message_id: msgId })
            }).then(res => res.json())
            .then(data => {
                if (data.success) {
                    // The socket will handle removal
                }
            });
        }

        function blockUser() {
            if (confirm('Are you sure you want to block this user?')) {
                fetch('/block_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ blocked_user_id: selectedUserId })
                }).then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('User blocked');
                        backToList();
                    }
                });
            }
        }
    </script>
</body>
</html>
