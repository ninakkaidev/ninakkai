<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification - Ninakkai</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: url("{{ url_for('static', filename='images/ihnatsi-yfull-XOGSjSKQIPE-unsplash.jpg') }}");
            background-position: center bottom;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
        }

        .welcome-text {
            color: white;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        .error-message {
            color: #ff4d6d;
            margin-bottom: 1rem;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            animation: fadeIn 0.3s ease;
        }

        .success-message {
            color: #4CAF50;
            margin-bottom: 1rem;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            animation: fadeIn 0.3s ease;
        }

        .toggle-buttons {
            display: flex;
            margin-bottom: 0;
            background: rgba(255, 255, 255, 0.014);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 5px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            transition: all 0.3s ease;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
        }

        .form-container.active {
            max-height: 1000px;
            opacity: 1;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .signup-steps {
            display: flex;
            width: 100%;
            transition: transform 0.5s ease;
            flex-direction: column;
        }

        .signup-step {
            width: 100%;
            padding: 0;
            display: none;
        }

        .signup-step.active {
            display: block;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            gap: 10px;
        }

        @media (min-width: 769px) {
            .step-indicator {
                display: none;
            }
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            background: white;
            transform: scale(1.2);
        }

        .form-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        @media (min-width: 769px) {
            .form-nav {
                display: flex;
            }
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form h2 {
            color: white;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .input-group input::placeholder, .input-group select option:first-child {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group select option {
            color: #333;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
        }

        .password-strength {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 5px;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: #ff4d6d;
            transition: all 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: rgba(255, 255, 255, 0.7);
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 1rem;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .google-btn {
            color: #4285F4;
        }

        .apple-btn {
            color: #000;
            background: rgba(255, 255, 255, 0.7);
        }

        .switch-form {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            transition: color 0.3s ease;
            cursor: pointer;
            margin-top: 10px;
        }

        .switch-form:hover {
            color: white;
            text-decoration: underline;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: white;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                width: 100%;
            }
            
            .form-container {
                padding: 1.5rem;
            }
            
            .form-container.active {
                margin-top: 1.5rem;
            }
            
            .toggle-btn {
                padding: 10px;
                font-size: 14px;
            }
            
            .welcome-text {
                font-size: 1.3rem;
            }
            
            .signup-step {
                padding: 0 5px;
            }
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 1000;
            padding: 5px 10px;
            background-color: rgba(0, 0, 0, 0.585);
            border-radius: 5px;
            background: linear-gradient(90deg, #ff0000, #0000ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: linear-gradient(90deg, #0000ff, #ff0000);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            opacity: 0.8;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4e54c8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .verification-section {
            display: none;
            text-align: center;
            color: white;
            animation: fadeIn 0.5s ease;
        }
        
        .verification-section.active {
            display: block;
        }
        
        .verification-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #4CAF50;
        }
        
        .verification-instructions {
            margin: 1rem 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .verification-instructions ol {
            padding-left: 20px;
            margin-top: 10px;
        }

        .verification-instructions li {
            margin-bottom: 8px;
        }
        
        .resend-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        
        .resend-link:hover {
            color: white;
            text-decoration: underline;
        }

        .verification-success {
            text-align: center;
            color: white;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        .verification-success-icon {
            font-size: 3rem;
            color: #4CAF50;
            margin-bottom: 1rem;
        }

        .verification-success h2 {
            margin-bottom: 1rem;
        }

        .verification-success p {
            margin-bottom: 1.5rem;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            text-decoration: none;
            display: inline-block;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            display: none !important;
        }

        /* Specific styles for age verification */
        #video {
            width: 100%;
            max-width: 320px;
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        #canvas {
            display: none;
        }

        #message {
            color: #ff4d6d;
            margin-top: 10px;
        }

        .age-verification-container {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            transition: all 0.3s ease;
        }

        .age-verification-text {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1.5rem;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            #video {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-text">Age Verification</div>
        <div class="age-verification-container">
            <p class="age-verification-text">We don't show this picture in your profile or store them in our server so don't worry.</p>
            <video id="video" autoplay></video>
            <button id="capture" class="submit-btn">Take Photo</button>
            <canvas id="canvas"></canvas>
            <div id="message" class="error-message"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const capture = document.getElementById('capture');
        const message = document.getElementById('message');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                message.textContent = 'Error accessing webcam: ' + err;
            });

        capture.addEventListener('click', () => {
            canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'photo.jpg');
                fetch('/age-verification', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/questions';
                    } else {
                        message.textContent = data.error;
                    }
                })
                .catch(err => {
                    message.textContent = 'Error: ' + err;
                });
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
