<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ninakkai</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: url("{{ url_for('static', filename='images/ihnatsi-yfull-XOGSjSKQIPE-unsplash.jpg') }}");
            background-position: center bottom;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .welcome-text {
            color: white;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        .error-message {
            color: #ff4d6d;
            margin-bottom: 1rem;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            animation: fadeIn 0.3s ease;
        }

        .success-message {
            color: #4CAF50;
            margin-bottom: 1rem;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            animation: fadeIn 0.3s ease;
        }

        h2 {
            color: white;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
        }

        .password-strength {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 5px;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: #ff4d6d;
            transition: all 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-link {
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: linear-gradient(90deg, #ff0000, #0000ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: linear-gradient(90deg, #0000ff, #ff0000);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            opacity: 0.8;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4e54c8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                width: 100%;
            }

            .welcome-text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <a href="{{ url_for('home') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="welcome-text">Reset Your Password</div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success-message">{{ success }}</div>
        {% endif %}

        <h2>Create New Password</h2>
        <form method="POST" action="{{ url_for('reset_password_endpoint', token=token) }}" id="resetPasswordForm">
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder="New Password" required minlength="8">
                <div class="password-strength">
                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                </div>
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="submit-btn" id="resetSubmitBtn">Reset Password</button>
        </form>
        <a href="{{ url_for('auth') }}" class="back-link">Back to Login</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordStrengthBar = document.getElementById('passwordStrengthBar');
            const resetForm = document.getElementById('resetPasswordForm');
            const resetSubmitBtn = document.getElementById('resetSubmitBtn');
            const loading = document.getElementById('loading');

            // Show/hide loading spinner
            function showLoading() {
                loading.style.display = 'flex';
            }

            function hideLoading() {
                loading.style.display = 'none';
            }

            // Password strength checker
            function checkPasswordStrength(password) {
                let strength = 0;
                if (password.length >= 8) strength += 25;
                if (/[A-Z]/.test(password)) strength += 25;
                if (/[0-9]/.test(password)) strength += 25;
                if (/[^A-Za-z0-9]/.test(password)) strength += 25;
                passwordStrengthBar.style.width = `${strength}%`;
                passwordStrengthBar.style.background = strength < 50 ? '#ff4d6d' : strength < 75 ? '#ffa500' : '#4CAF50';
            }

            // Validate password match
            function validatePasswords() {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    confirmPasswordInput.setCustomValidity('Passwords do not match');
                } else {
                    confirmPasswordInput.setCustomValidity('');
                }
            }

            // Show error message
            function showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                const existingError = document.querySelector('.error-message');
                if (existingError) existingError.remove();
                document.querySelector('.container').insertBefore(errorDiv, document.querySelector('h2'));
                setTimeout(() => errorDiv.remove(), 5000);
            }

            // Event listeners
            passwordInput.addEventListener('input', () => {
                checkPasswordStrength(passwordInput.value);
                validatePasswords();
            });

            confirmPasswordInput.addEventListener('input', validatePasswords);

            resetForm.addEventListener('submit', function(e) {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    e.preventDefault();
                    showError('Passwords do not match');
                    return;
                }
                if (passwordInput.value.length < 8) {
                    e.preventDefault();
                    showError('Password must be at least 8 characters');
                    return;
                }
                showLoading();
                resetSubmitBtn.disabled = true;
            });
        });
    </script>
</body>
</html>
